<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Laptop showing code" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- laptop lid -->
  <rect x="110" y="50" width="380" height="240" rx="14" fill="#0b1929" stroke="#4f5f76" stroke-width="3"/>
  <!-- screen -->
  <rect x="126" y="66" width="348" height="208" rx="6" fill="#05101d"/>

  <!-- window bar -->
  <circle cx="142" cy="80" r="4.5" fill="#B77A91"/>
  <circle cx="158" cy="80" r="4.5" fill="#4f5f76"/>
  <circle cx="174" cy="80" r="4.5" fill="#4f5f76"/>
  <line x1="126" y1="94" x2="474" y2="94" stroke="#4f5f76" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- code lines -->
  <g>
    <rect x="146" y="112" width="60"  height="10" rx="5" fill="#B77A91"/>
    <rect x="214" y="112" width="90"  height="10" rx="5" fill="#ffffff" fill-opacity="0.85"/>

    <rect x="166" y="134" width="80"  height="10" rx="5" fill="#4f5f76"/>
    <rect x="254" y="134" width="110" height="10" rx="5" fill="#d9a9bb"/>

    <rect x="166" y="156" width="50"  height="10" rx="5" fill="#B77A91"/>
    <rect x="224" y="156" width="70"  height="10" rx="5" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="302" y="156" width="40"  height="10" rx="5" fill="#d9a9bb"/>

    <rect x="186" y="178" width="120" height="10" rx="5" fill="#4f5f76"/>

    <rect x="166" y="200" width="100" height="10" rx="5" fill="#d9a9bb"/>
    <rect x="274" y="200" width="44"  height="10" rx="5" fill="#B77A91"/>

    <rect x="146" y="222" width="30"  height="10" rx="5" fill="#B77A91"/>

    <!-- cursor -->
    <rect x="184" y="220" width="3" height="14" fill="#B77A91"/>
  </g>

  <!-- laptop base -->
  <path d="M70 290 H530 L548 312 Q551 322 538 322 H62 Q49 322 52 312 Z" fill="#4f5f76"/>
  <rect x="260" y="290" width="80" height="8" rx="4" fill="#05101d" fill-opacity="0.55"/>

  <!-- floating badges -->
  <rect x="420" y="12" width="92" height="44" rx="12" fill="#B77A91"/>
  <text x="466" y="42" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="22" font-weight="bold" fill="#05101d">&lt;/&gt;</text>

  <rect x="68" y="228" width="84" height="42" rx="12" fill="#0b1929" stroke="#B77A91" stroke-width="2"/>
  <text x="110" y="256" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" font-weight="bold" fill="#B77A91">{ }</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
